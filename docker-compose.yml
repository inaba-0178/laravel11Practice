version: '3.8'
services:
  php:
    ports:
      - "8085:8085"
    container_name: php
    build: 
      context: .               # ← Laravel自動生成Dockerfile
      dockerfile: docker-config/php/Dockerfile
    volumes:
      - ./app:/var/www
    depends_on:
      mst-db:
        condition: service_healthy
      user-db:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DB_MST_HOST: mst-db
      DB_MST_PORT: 3306
      DB_USER_HOST: user-db
      DB_USER_PORT: 3306
    networks:
      - app-network

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "81:80"
      - "5173:5173"
    volumes:
      - ./app:/var/www:ro
      - ./docker-config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  mst-db:
    container_name: mst-db
    image: mariadb:11
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${MST_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MST_ROOT_PASSWORD}
      MYSQL_USER: ${MST_USER}
      MYSQL_PASSWORD: ${MST_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - mst-db-data:/var/lib/mysql  # ← 名前付きボリューム使用
      - ./docker-config/mariadb/mst/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  user-db:
    container_name: user-db
    image: mariadb:11
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ${USER_DATABASE}
      MYSQL_ROOT_PASSWORD: ${USER_ROOT_PASSWORD}
      MYSQL_USER: ${USER_USER}
      MYSQL_PASSWORD: ${USER_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - user-db-data:/var/lib/mysql  # ← 名前付きボリューム使用
      - ./docker-config/mariadb/user/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mailhog:
      image: mailhog/mailhog
      ports:
        - "1025:1025"
        - "8025:8025"
      networks:
        - app-network

 # ===== MinIO（S3互換ローカルストレージ） =====
  minio:
    container_name: minio
    image: minio/minio
    ports:
      - "9000:9000"   # API（Laravelからの接続先）
      - "9001:9001"   # 管理画面（ブラウザで確認）
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
 
  # ===== MinIOバケット自動作成 =====
  minio-init:
    container_name: minio-init
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/car-images;
      mc anonymous set public local/car-images;
      exit 0;
      "
    networks:
      - app-network
 
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
 
volumes:
  mst-db-data:
  user-db-data:
  minio-data:
  redis-data: